<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="paduraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Shield Outline -->
  <polygon points="50,6 90,26 90,74 50,94 10,74 10,26" 
           fill="#0F172A" 
           stroke="url(#paduraGrad)" 
           stroke-width="5" 
           stroke-linejoin="round" />

  <!-- Radio Waves -->
  <path d="M 32 40 A 18 18 0 0 1 32 60" stroke="#7C3AED" stroke-width="3.5" stroke-linecap="round" opacity="0.6" />
  <path d="M 24 33 A 28 28 0 0 1 24 67" stroke="#2563EB" stroke-width="3" stroke-linecap="round" opacity="0.3" />

  <!-- Modern Play Triangle -->
  <polygon points="46,36 68,50 46,64" 
           fill="url(#paduraGrad)" 
           filter="url(#glow)" />

  <!-- Live Red Indicator Dot -->
  <circle cx="78" cy="22" r="5" fill="#EF4444">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite" />
  </circle>
</svg>
