<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – PADURA LIVE</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/night-theme.css">
  <style>
    html,
    body {
      background: #0b0f19 !important;
      color: #F8FAFC !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .padura-bg-backdrop,
    .ambient-glow {
      display: none !important;
    }
    .auth-page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      position: relative;
      z-index: 1;
      background:
        radial-gradient(circle at 50% 0%, rgba(251, 191, 36, 0.08), transparent 45%),
        #0b0f19 !important;
    }
    .auth-card {
      width: 100%;
      max-width: 460px;
      background: #111624 !important;
      border: 1px solid rgba(251, 191, 36, 0.22) !important;
      border-radius: var(--radius-lg, 12px);
      padding: clamp(24px, 5vw, 42px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75), 0 0 32px rgba(251, 191, 36, 0.06) !important;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      position: relative;
      z-index: 10;
      overflow: hidden;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #D97706, #FBBF24, #F59E0B) !important;
    }
    .auth-banner-thumb {
      width: 100%;
      height: 112px;
      border-radius: var(--radius-md, 8px);
      overflow: hidden;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(251, 191, 36, 0.2);
      position: relative;
    }
    .auth-banner-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
    }
    .auth-banner-badge {
      position: absolute;
      bottom: 6px;
      right: 8px;
      background: rgba(7, 11, 20, 0.88);
      padding: 3px 10px;
      border-radius: var(--radius-full, 9999px);
      font-size: 0.7rem;
      font-weight: 800;
      color: #FBBF24;
      border: 1px solid rgba(245, 158, 11, 0.45);
      letter-spacing: 0.04em;
    }
    .auth-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 1.75rem;
    }
    .auth-brand img {
      width: 48px;
      height: 48px;
      margin-bottom: 0.65rem;
      filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.35));
    }
    .auth-brand h2 {
      background: none !important;
      color: #FFFFFF !important;
      -webkit-text-fill-color: #FFFFFF !important;
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      margin: 0;
    }
    .auth-brand p {
      font-size: 0.85rem;
      color: #CBD5E1 !important;
      margin-top: 0.35rem;
      font-weight: 400;
    }
    .form-label {
      color: #E2E8F0 !important;
      font-weight: 600;
      font-size: 0.86rem;
    }
    .form-label .required {
      color: #FBBF24;
    }
    .form-input {
      background: #0b0f19 !important;
      border: 1px solid rgba(148, 163, 184, 0.28) !important;
      border-radius: 6px;
      color: #FFFFFF !important;
      font-size: 0.94rem;
    }
    .form-input::placeholder {
      color: #94A3B8 !important;
      opacity: 1;
    }
    .form-input:focus {
      border-color: #FBBF24 !important;
      box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.18) !important;
      outline: none;
    }
    .input-icon,
    .toggle-pw {
      color: #94A3B8 !important;
    }
    .toggle-pw:hover {
      color: #FBBF24 !important;
    }
    .btn-primary {
      background: linear-gradient(135deg, #F59E0B, #FBBF24) !important;
      border-color: #F59E0B !important;
      color: #0b0f19 !important;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.25) !important;
      transition: filter 0.2s ease, transform 0.15s ease;
    }
    .btn-primary:hover {
      filter: brightness(1.08);
      border-color: #FBBF24 !important;
    }
    .auth-helper-text {
      font-size: 0.78rem;
      color: #94A3B8;
      margin-top: 0.4rem;
    }
    .auth-footer {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: #94A3B8;
    }
  </style>
</head>
<body>
  <!-- Fixed Padura Photo Background Backdrop -->
  <div class="padura-bg-backdrop"></div>
  <div class="ambient-glow"></div>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <!-- Mini Padura Event Banner Showcase -->
      <div class="auth-banner-thumb">
        <img src="assets/images/padura-banner.jpg" alt="Padura Concert Banner">
        <div class="auth-banner-badge">පැදුර • LIVE ON-AIR</div>
      </div>

      <div class="auth-brand">
        <a href="index.html"><img src="assets/images/logo.svg" alt="Padura Live"></a>
        <h2>PADURA LIVE</h2>
        <p>Private Gateway to Padura Live Events • Kelaniya</p>
      </div>

      <!-- Unified Login Form -->
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-identifier">
            Username, Student Number, or Email <span class="required">*</span>
          </label>
          <div class="input-with-icon">
            <span class="input-icon">
              <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </span>
            <input
              type="text"
              id="login-identifier"
              class="form-input"
              placeholder="e.g. PS/2023/XXX, username, or email"
              required
              autofocus
              autocomplete="username"
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">
            Password <span class="required">*</span>
          </label>
          <div class="input-with-icon">
            <span class="input-icon">
              <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </span>
            <input
              type="password"
              id="login-password"
              class="form-input"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            >
            <button type="button" class="toggle-pw" id="btn-toggle-pw" title="Show/Hide password" aria-label="Show or hide password">
              <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="btn-submit-login" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.8rem;">
          <span id="btn-text">Sign In</span>
        </button>
      </form>

      <div class="auth-footer">
        New student? <a href="student-register.html" style="color:#D7B879;font-weight:700;text-decoration:none;">Create your student account</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    const identifierInput = document.getElementById("login-identifier");
    const pwInput = document.getElementById("login-password");
    const togglePwBtn = document.getElementById("btn-toggle-pw");
    const loginForm = document.getElementById("login-form");
    const submitBtn = document.getElementById("btn-submit-login");
    const btnText = document.getElementById("btn-text");

    // Password visibility toggle
    togglePwBtn.addEventListener("click", () => {
      const isPw = pwInput.type === "password";
      pwInput.type = isPw ? "text" : "password";
    });

    // Unified Form Submit (role routing handled automatically by PaduraAuth.login)
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const identifier = identifierInput.value.trim();
      const password = pwInput.value.trim();

      if (!identifier || !password) return;

      submitBtn.disabled = true;
      btnText.textContent = "Authenticating...";

      try {
        await window.PaduraAuth.login(identifier, password);
      } catch (err) {
        if (window.showToast) {
          window.showToast(err.message || "Sign in failed.", "error");
        }
        submitBtn.disabled = false;
        btnText.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
