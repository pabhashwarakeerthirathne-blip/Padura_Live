<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – PADURA LIVE</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .auth-page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      position: relative;
      z-index: 1;
    }
    .auth-card {
      width: 100%;
      max-width: 460px;
      background: rgba(13, 17, 32, 0.86);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(236, 72, 153, 0.35);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(168, 85, 247, 0.3);
      position: relative;
      z-index: 10;
      overflow: hidden;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--marquee-gradient);
    }
    .auth-banner-thumb {
      width: 100%;
      height: 85px;
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      position: relative;
    }
    .auth-banner-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
    }
    .auth-banner-badge {
      position: absolute;
      bottom: 6px;
      right: 8px;
      background: rgba(7, 11, 20, 0.85);
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-size: 0.68rem;
      font-weight: 800;
      color: #FBBF24;
      border: 1px solid rgba(245, 158, 11, 0.4);
      letter-spacing: 0.04em;
    }
    .auth-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 1.75rem;
    }
    .auth-brand img {
      width: 48px;
      height: 48px;
      margin-bottom: 0.65rem;
      filter: drop-shadow(0 0 12px rgba(236, 72, 153, 0.5));
    }
    .auth-brand h2 {
      font-size: 1.65rem;
      font-weight: 900;
      background: var(--marquee-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.02em;
    }
    .auth-brand p {
      font-size: 0.8rem;
      color: #CBD5E1;
      margin-top: 0.25rem;
      font-weight: 500;
    }
    .auth-helper-text {
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-top: 0.4rem;
    }
    .auth-footer {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <!-- Fixed Padura Photo Background Backdrop -->
  <div class="padura-bg-backdrop"></div>
  <div class="ambient-glow"></div>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <!-- Mini Padura Event Banner Showcase -->
      <div class="auth-banner-thumb">
        <img src="assets/images/padura-banner.jpg" alt="Padura Concert Banner">
        <div class="auth-banner-badge">පැදුර • LIVE ON-AIR</div>
      </div>

      <div class="auth-brand">
        <a href="index.html"><img src="assets/images/logo.svg" alt="Padura Live"></a>
        <h2>PADURA LIVE</h2>
        <p>Private Gateway to Padura Live Events • Kelaniya</p>
      </div>

      <!-- Unified Login Form -->
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-identifier">
            Username, Student Number, or Email <span class="required">*</span>
          </label>
          <div class="input-with-icon">
            <span class="input-icon">
              <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </span>
            <input
              type="text"
              id="login-identifier"
              class="form-input"
              placeholder="e.g. PS/2023/XXX, username, or email"
              required
              autofocus
              autocomplete="username"
            >
          </div>
          <div class="auth-helper-text">
            Sign in with your assigned account — you will be redirected to your portal automatically.
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">
            Password <span class="required">*</span>
          </label>
          <div class="input-with-icon">
            <span class="input-icon">
              <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </span>
            <input
              type="password"
              id="login-password"
              class="form-input"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            >
            <button type="button" class="toggle-pw" id="btn-toggle-pw" title="Show/Hide password" aria-label="Show or hide password">
              <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="btn-submit-login" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.8rem;">
          <span id="btn-text">Sign In</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    const identifierInput = document.getElementById("login-identifier");
    const pwInput = document.getElementById("login-password");
    const togglePwBtn = document.getElementById("btn-toggle-pw");
    const loginForm = document.getElementById("login-form");
    const submitBtn = document.getElementById("btn-submit-login");
    const btnText = document.getElementById("btn-text");

    // Password visibility toggle
    togglePwBtn.addEventListener("click", () => {
      const isPw = pwInput.type === "password";
      pwInput.type = isPw ? "text" : "password";
    });

    // Unified Form Submit (role routing handled automatically by PaduraAuth.login)
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const identifier = identifierInput.value.trim();
      const password = pwInput.value.trim();

      if (!identifier || !password) return;

      submitBtn.disabled = true;
      btnText.textContent = "Authenticating...";

      try {
        await window.PaduraAuth.login(identifier, password);
      } catch (err) {
        if (window.showToast) {
          window.showToast(err.message || "Sign in failed.", "error");
        }
        submitBtn.disabled = false;
        btnText.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
